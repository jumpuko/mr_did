<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<body class="h-full text-gray-800 flex flex-col">

    <div id="global-loader" class="fixed inset-0 bg-gray-900/50 z-50 flex items-center justify-center hidden">
        <div class="bg-white p-5 rounded-xl shadow-lg flex flex-col items-center space-y-3">
            <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-12 w-12"></div>
            <p class="text-sm font-medium text-gray-600">กำลังประมวลผล...</p>
        </div>
    </div>

    <div id="app" class="flex flex-col min-h-screen">
        </div>

    <script>
        // ==========================================
        // CONFIGURATION SUPABASE
        // ==========================================
        const SUPABASE_URL = "https://tqqhqeoyvhrnhfwjquxk.supabase.co"; 
        const SUPABASE_ANON_KEY = "sb_publishable_xokbGPN9GUOGmTD6lsdsAg_yYb2_T8M";

        // หลีกเลี่ยงการใช้ชื่อตัวแปร 'supabase' ซ้ำตามกฎข้อบังคับ
        const dbClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ==========================================
        // STATE MANAGEMENT (SPA)
        // ==========================================
        let appState = {
            user: null, // เก็บข้อมูลผู้ใช้ที่ Login { id, username, full_name, role }
            currentView: 'login', // หน้าปัจจุบัน: login, dashboard, employee_list, user_management
            employees: [],
            users: [],
            editingEmployee: null,
            editingUser: null
        };

        // ==========================================
        // APP INITIALIZATION & UTILITIES
        // ==========================================
        document.addEventListener("DOMContentLoaded", () => {
            renderApp();
            lucide.createIcons();
        });

        function showLoader(show) {
            const loader = document.getElementById('global-loader');
            if (loader) {
                if (show) loader.classList.remove('hidden');
                else loader.classList.add('hidden');
            }
        }

        // ฟังก์ชันช่วยจัดการเมื่อภาพโหลดไม่ได้ (Fallback)
        function handleImageError(imgElement) {
            imgElement.onerror = null; // ป้องกัน Loop อินฟินิตี้
            imgElement.parentElement.innerHTML = `
                <div class="w-full h-full bg-gray-200 flex items-center justify-center text-gray-400">
                    <span class="text-xs">ไม่มีรูปภาพ</span>
                </div>
            `;
        }

        // ฟังก์ชันบีบอัดรูปภาพด้วย HTML5 Canvas
        function compressImage(file, maxWidth = 300, quality = 0.7) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;

                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }

                        canvas.width = width;
                        canvas.height = height;

                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        canvas.toBlob((blob) => {
                            if (blob) {
                                resolve(new File([blob], file.name, { type: 'image/jpeg', lastModified: Date.now() }));
                            } else {
                                reject(new Error('บีบอัดภาพล้มเหลว'));
                            }
                        }, 'image/jpeg', quality);
                    };
                };
                reader.onerror = (err) => reject(err);
            });
        }

        // เปลี่ยนหน้าของระบบ SPA (ล้างค่าและไม่โหลดเว็บใหม่)
        function navigateTo(view) {
            appState.currentView = view;
            appState.editingEmployee = null;
            appState.editingUser = null;
            renderApp();
            
            if (view === 'dashboard') {
                initDashboardCharts();
            }
            lucide.createIcons();
        }

        // ==========================================
        // BUSINESS LOGIC & API CALLS
        // ==========================================
        
        async function handleLogin(username, password) {
            showLoader(true);
            try {
                const { data, error } = await dbClient
                    .from('users')
                    .select('*')
                    .eq('username', username)
                    .eq('password', password)
                    .single();

                if (error || !data) {
                    alert('ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง');
                } else {
                    appState.user = data;
                    // คัดกรองตามสิทธิ์การเข้าถึงหน้าแรก
                    if(data.role === 'employee') {
                        navigateTo('dashboard');
                    } else {
                        navigateTo('dashboard');
                    }
                }
            } catch (err) {
                console.error(err);
                alert('เกิดข้อผิดพลาดในการเชื่อมต่อระบบ');
            } finally {
                showLoader(false);
            }
        }

        function handleLogout() {
            appState.user = null;
            navigateTo('login');
        }

        async function fetchEmployees() {
            showLoader(true);
            try {
                let query = dbClient.from('employees').select('*');
                
                // ถ้าสิทธิ์เป็นพนักงานธรรมดา ให้ดึงเฉพาะข้อมูลตนเองที่มีชื่อตรงกัน
                if (appState.user.role === 'employee') {
                    query = query.eq('full_name', appState.user.full_name);
                }

                const { data, error } = await query.order('id', { ascending: false });
                if (!error) appState.employees = data;
            } catch (e) {
                console.error(e);
            } finally {
                showLoader(false);
            }
        }

        async function fetchUsers() {
            showLoader(true);
            try {
                const { data, error } = await dbClient.from('users').select('*').order('id', { ascending: false });
                if (!error) appState.users = data;
            } catch (e) {
                console.error(e);
            } finally {
                showLoader(false);
            }
        }

        async function saveEmployee(event) {
            event.preventDefault();
            showLoader(true);

            const formData = new FormData(event.target);
            const fileInput = document.getElementById('emp_avatar');
            let avatarUrl = appState.editingEmployee ? appState.editingEmployee.avatar_url : null;

            try {
                // จัดการอัปโหลดและบีบอัดภาพ
                if (fileInput && fileInput.files.length > 0) {
                    const originalFile = fileInput.files[0];
                    const compressedFile = await compressImage(originalFile, 300, 0.6); // บีบอัดไฟล์เหลือ 300px
                    
                    const fileExt = 'jpg';
                    const fileName = `${Date.now()}_${Math.random().toString(36).substring(7)}.${fileExt}`;
                    const filePath = `avatars/${fileName}`;

                    const { error: uploadError } = await dbClient.storage
                        .from('hr-avatars')
                        .upload(filePath, compressedFile);

                    if (uploadError) throw uploadError;

                    const { data: publicUrlData } = dbClient.storage
                        .from('hr-avatars')
                        .getPublicUrl(filePath);
                        
                    avatarUrl = publicUrlData.publicUrl;
                }

                const empData = {
                    emp_code: formData.get('emp_code'),
                    full_name: formData.get('full_name'),
                    department: formData.get('department'),
                    position: formData.get('position'),
                    salary: parseFloat(formData.get('salary')),
                    phone: formData.get('phone'),
                    avatar_url: avatarUrl
                };

                if (appState.editingEmployee) {
                    // Update
                    const { error } = await dbClient.from('employees').update(empData).eq('id', appState.editingEmployee.id);
                    if (error) throw error;
                } else {
                    // Create
                    const { error } = await dbClient.from('employees').insert([empData]);
                    if (error) throw error;
                }

                alert('บันทึกข้อมูลพนักงานสำเร็จ');
                await fetchEmployees();
                navigateTo('employee_list');
            } catch (err) {
                alert('เกิดข้อผิดพลาด: ' + err.message);
            } finally {
                showLoader(false);
            }
        }

        async function deleteEmployee(id) {
            if (!confirm('คุณแน่ใจหรือไม่ที่จะลบพนักงานรายนี้?')) return;
            showLoader(true);
            try {
                const { error } = await dbClient.from('employees').delete().eq('id', id);
                if (error) throw error;
                alert('ลบข้อมูลสำเร็จ');
                await fetchEmployees();
                navigateTo('employee_list');
            } catch (err) {
                alert(err.message);
            } finally {
                showLoader(false);
            }
        }

        async function saveUser(event) {
            event.preventDefault();
            showLoader(true);
            const formData = new FormData(event.target);
            const userData = {
                username: formData.get('username'),
                password: formData.get('password'),
                full_name: formData.get('full_name'),
                role: formData.get('role')
            };

            try {
                if (appState.editingUser) {
                    const { error } = await dbClient.from('users').update(userData).eq('id', appState.editingUser.id);
                    if (error) throw error;
                } else {
                    const { error } = await dbClient.from('users').insert([userData]);
                    if (error) throw error;
                }
                alert('บันทึกข้อมูลผู้ใช้งานสำเร็จ');
                await fetchUsers();
                navigateTo('user_management');
            } catch (err) {
                alert(err.message);
            } finally {
                showLoader(false);
            }
        }

        async function deleteUser(id) {
            if (!confirm('คุณแน่ใจหรือไม่ที่จะลบผู้ใช้นี้?')) return;
            showLoader(true);
            try {
                const { error } = await dbClient.from('users').delete().eq('id', id);
                if (error) throw error;
                alert('ลบข้อมูลผู้ใช้สำเร็จ');
                await fetchUsers();
                navigateTo('user_management');
            } catch (err) {
                alert(err.message);
            } finally {
                showLoader(false);
            }
        }

        // ==========================================
        // GRAPH / CHARTS PRESENTATION
        // ==========================================
        function initDashboardCharts() {
            const ctx = document.getElementById('deptChart');
            if (!ctx) return;

            // คัดแยกกลุ่มแผนกเพื่อนับจำนวนพนักงาน
            const deptCounts = {};
            appState.employees.forEach(emp => {
                deptCounts[emp.department] = (deptCounts[emp.department] || 0) + 1;
            });

            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: Object.keys(deptCounts).length ? Object.keys(deptCounts) : ['ไม่มีข้อมูล'],
                    datasets: [{
                        label: 'จำนวนพนักงาน (คน)',
                        data: Object.values(deptCounts).length ? Object.values(deptCounts) : [0],
                        backgroundColor: 'rgba(59, 130, 246, 0.6)',
                        borderColor: 'rgba(59, 130, 246, 1)',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
                }
            });
        }

        // ==========================================
        // UI RENDER ENGINE (HTML TEMPLATES)
        // ==========================================
        function renderApp() {
            const app = document.getElementById('app');
            
            if (appState.currentView === 'login') {
                app.innerHTML = renderLogin();
                return;
            }

            // แทรก Navbar & Layout หลักสำหรับหน้าด้านใน
            app.innerHTML = `
                ${renderNavbar()}
                <div class="flex-1 md:flex">
                    ${renderSidebar()}
                    <main class="flex-1 p-4 md:p-8 overflow-y-auto">
                        ${renderMainContent()}
                    </main>
                </div>
            `;
        }

        function renderLogin() {
            return `
                <div class="min-h-screen flex items-center justify-center px-4 bg-gradient-to-br from-blue-600 to-indigo-900">
                    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 space-y-6">
                        <div class="text-center">
                            <h2 class="text-3xl font-bold text-gray-900">SmartHRJUMPUKO</h2>
                            <p class="text-sm text-gray-500 mt-2">ระบบบริหารจัดการพนักงานยุคใหม่</p>
                        </div>
                        <form onsubmit="event.preventDefault(); handleLogin(this.username.value, this.password.value);" class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700">ชื่อผู้ใช้งาน</label>
                                <input type="text" name="username" required class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 outline-none transition" placeholder="admin01 / hr01 / emp01">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">รหัสผ่าน</label>
                                <input type="password" name="password" required class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 outline-none transition" placeholder="password123">
                            </div>
                            <button type="submit" class="w-full py-2.5 px-4 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg shadow transition-colors">เข้าสู่ระบบ</button>
                        </form>
                    </div>
                </div>
            `;
        }

        function renderNavbar() {
            return `
                <header class="bg-white border-b border-gray-200 sticky top-0 z-30">
                    <div class="px-4 py-3 flex items-center justify-between">
                        <div class="flex items-center space-x-3">
                            <div class="p-2 bg-blue-600 rounded-lg text-white">
                                <i data-lucide="layers" class="w-6 h-6"></i>
                            </div>
                            <span class="text-xl font-bold tracking-wider text-blue-600">SmartHR</span>
                        </div>
                        <div class="flex items-center space-x-4">
                            <div class="hidden sm:block text-right">
                                <div class="text-sm font-medium text-gray-900">${appState.user.full_name}</div>
                                <div class="text-xs text-gray-500 uppercase font-semibold">สิทธิ์: ${appState.user.role}</div>
                            </div>
                            <button onclick="handleLogout()" class="p-2 text-gray-500 hover:text-red-600 rounded-lg transition-colors">
                                <i data-lucide="log-out" class="w-5 h-5"></i>
                            </button>
                        </div>
                    </div>
                </header>
            `;
        }

        function renderSidebar() {
            const isEmployee = appState.user.role === 'employee';
            const isAdmin = appState.user.role === 'admin';
            
            return `
                <aside class="bg-white border-b md:border-b-0 md:border-r border-gray-200 md:w-64 px-4 py-2 md:py-6 flex flex-row md:flex-col space-x-2 md:space-x-0 md:space-y-1 overflow-x-auto md:overflow-x-visible">
                    <button onclick="navigateTo('dashboard')" class="flex items-center space-x-3 px-4 py-2 rounded-lg text-sm font-medium ${appState.currentView === 'dashboard' ? 'bg-blue-50 text-blue-600' : 'text-gray-600 hover:bg-gray-50'} whitespace-nowrap">
                        <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
                        <span>แดชบอร์ด</span>
                    </button>
                    <button onclick="fetchEmployees().then(()=>navigateTo('employee_list'))" class="flex items-center space-x-3 px-4 py-2 rounded-lg text-sm font-medium ${appState.currentView === 'employee_list' ? 'bg-blue-50 text-blue-600' : 'text-gray-600 hover:bg-gray-50'} whitespace-nowrap">
                        <i data-lucide="users" class="w-5 h-5"></i>
                        <span>${isEmployee ? 'ข้อมูลของฉัน' : 'จัดการข้อมูลพนักงาน'}</span>
                    </button>
                    ${isAdmin ? `
                    <button onclick="fetchUsers().then(()=>navigateTo('user_management'))" class="flex items-center space-x-3 px-4 py-2 rounded-lg text-sm font-medium ${appState.currentView === 'user_management' ? 'bg-blue-50 text-blue-600' : 'text-gray-600 hover:bg-gray-50'} whitespace-nowrap">
                        <i data-lucide="shield-alert" class="w-5 h-5"></i>
                        <span>จัดการผู้ใช้งานระบบ</span>
                    </button>
                    ` : ''}
                </aside>
            `;
        }

        function renderMainContent() {
            switch(appState.currentView) {
                case 'dashboard': return renderDashboardView();
                case 'employee_list': return renderEmployeeListView();
                case 'employee_form': return renderEmployeeFormView();
                case 'user_management': return renderUserManagementView();
                case 'user_form': return renderUserFormView();
                default: return `<h2>ไม่พบหน้านี้</h2>`;
            }
        }

        function renderDashboardView() {
            const totalEmps = appState.employees.length;
            const avgSalary = totalEmps > 0 ? (appState.employees.reduce((acc, curr) => acc + parseFloat(curr.salary), 0) / totalEmps).toLocaleString() : '0';
            
            return `
                <div class="space-y-6">
                    <div>
                        <h1 class="text-2xl font-bold text-gray-900">ภาพรวมระบบ (Dashboard)</h1>
                        <p class="text-sm text-gray-500">ยินดีต้อนรับคุณ ${appState.user.full_name} เข้าสู่ระบบ SmartHRJUMPUKO</p>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                        <div class="bg-white p-6 rounded-xl border border-gray-200 flex items-center space-x-4">
                            <div class="p-3 bg-blue-100 rounded-lg text-blue-600"><i data-lucide="users" class="w-6 h-6"></i></div>
                            <div>
                                <p class="text-sm text-gray-500 font-medium">พนักงานในระบบทั้งหมด</p>
                                <p class="text-2xl font-bold">${totalEmps} คน</p>
                            </div>
                        </div>
                        <div class="bg-white p-6 rounded-xl border border-gray-200 flex items-center space-x-4">
                            <div class="p-3 bg-green-100 rounded-lg text-green-600"><i data-lucide="banknote" class="w-6 h-6"></i></div>
                            <div>
                                <p class="text-sm text-gray-500 font-medium">เงินเดือนเฉลี่ย</p>
                                <p class="text-2xl font-bold">${avgSalary} ฿</p>
                            </div>
                        </div>
                        <div class="bg-white p-6 rounded-xl border border-gray-200 flex items-center space-x-4 col-span-1 sm:col-span-2 lg:col-span-1">
                            <div class="p-3 bg-purple-100 rounded-lg text-purple-600"><i data-lucide="fingerprint" class="w-6 h-6"></i></div>
                            <div>
                                <p class="text-sm text-gray-500 font-medium">สิทธิ์ปัจจุบันของคุณ</p>
                                <p class="text-2xl font-bold text-purple-700 uppercase">${appState.user.role}</p>
                            </div>
                        </div>
                    </div>

                    <div class="bg-white p-6 rounded-xl border border-gray-200">
                        <h3 class="text-lg font-medium text-gray-900 mb-4">สถิติจำนวนพนักงานจำแนกตามแผนก</h3>
                        <div class="relative h-64 w-full">
                            <canvas id="deptChart"></canvas>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderEmployeeListView() {
            const canManage = appState.user.role === 'admin' || appState.user.role === 'hr';
            
            return `
                <div class="space-y-6">
                    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                        <div>
                            <h1 class="text-2xl font-bold text-gray-900">ฐานข้อมูลพนักงาน</h1>
                            <p class="text-sm text-gray-500">เรียกดู บันทึก และอัปเดตข้อมูลบุคลากรในองค์กร</p>
                        </div>
                        ${canManage ? `
                        <button onclick="navigateTo('employee_form')" class="inline-flex items-center space-x-2 px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium text-sm rounded-lg shadow transition-colors">
                            <i data-lucide="user-plus" class="w-4 h-4"></i>
                            <span>เพิ่มพนักงานใหม่</span>
                        </button>
                        ` : ''}
                    </div>

                    <div class="bg-white rounded-xl border border-gray-200 overflow-hidden shadow-sm">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead class="bg-gray-50 border-b border-gray-200">
                                    <tr>
                                        <th class="p-4 text-xs font-semibold uppercase text-gray-500">พนักงาน</th>
                                        <th class="p-4 text-xs font-semibold uppercase text-gray-500">รหัสพนักงาน</th>
                                        <th class="p-4 text-xs font-semibold uppercase text-gray-500">แผนก / ตำแหน่ง</th>
                                        <th class="p-4 text-xs font-semibold uppercase text-gray-500">เงินเดือน</th>
                                        <th class="p-4 text-xs font-semibold uppercase text-gray-500">เบอร์โทรศัพท์</th>
                                        ${canManage ? `<th class="p-4 text-xs font-semibold uppercase text-gray-500 text-center">จัดการ</th>` : ''}
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-gray-100">
                                    ${appState.employees.length === 0 ? `
                                        <tr>
                                            <td colspan="${canManage ? 6 : 5}" class="p-8 text-center text-gray-400">ไม่พบข้อมูลพนักงานในระบบ</td>
                                        </tr>
                                    ` : appState.employees.map(emp => `
                                        <tr class="hover:bg-gray-50/70 transition-colors">
                                            <td class="p-4 flex items-center space-x-3">
                                                <div class="w-10 h-10 rounded-full overflow-hidden border border-gray-200 bg-gray-100 flex-shrink-0">
                                                    ${emp.avatar_url ? `<img src="${emp.avatar_url}" alt="Avatar" class="w-full h-full object-cover" onerror="handleImageError(this)">` : `
                                                        <div class="w-full h-full flex items-center justify-center text-gray-400"><i data-lucide="user" class="w-5 h-5"></i></div>
                                                    `}
                                                </div>
                                                <div class="font-medium text-gray-900">${emp.full_name}</div>
                                            </td>
                                            <td class="p-4 text-sm font-mono text-gray-600">${emp.emp_code}</td>
                                            <td class="p-4 text-sm">
                                                <div class="text-gray-900 font-medium">${emp.department}</div>
                                                <div class="text-gray-500 text-xs">${emp.position}</div>
                                            </td>
                                            <td class="p-4 text-sm font-medium text-gray-900">฿${parseFloat(emp.salary).toLocaleString()}</td>
                                            <td class="p-4 text-sm text-gray-600">${emp.phone || '-'}</td>
                                            ${canManage ? `
                                            <td class="p-4 text-center space-x-2 whitespace-nowrap">
                                                <button onclick="appState.editingEmployee = ${JSON.stringify(emp).replace(/"/g, '&quot;')}; navigateTo('employee_form');" class="p-1.5 text-blue-600 hover:bg-blue-50 rounded transition-colors"><i data-lucide="pencil" class="w-4 h-4"></i></button>
                                                <button onclick="deleteEmployee(${emp.id})" class="p-1.5 text-red-600 hover:bg-red-50 rounded transition-colors"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                                            </td>
                                            ` : ''}
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderEmployeeFormView() {
            const emp = appState.editingEmployee;
            return `
                <div class="max-w-2xl mx-auto space-y-6">
                    <div>
                        <h1 class="text-2xl font-bold text-gray-900">${emp ? 'แก้ไขข้อมูลพนักงาน' : 'เพิ่มข้อมูลพนักงานใหม่'}</h1>
                        <p class="text-sm text-gray-500">กรอกรายละเอียดต่างๆ ด้านล่างเพื่ออัปเดตระบบฐานข้อมูล</p>
                    </div>

                    <form onsubmit="saveEmployee(event)" class="bg-white border border-gray-200 rounded-xl p-6 shadow-sm space-y-4">
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700">รหัสพนักงาน <span class="text-red-500">*</span></label>
                                <input type="text" name="emp_code" required value="${emp ? emp.emp_code : ''}" class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">ชื่อ-นามสกุล <span class="text-red-500">*</span></label>
                                <input type="text" name="full_name" required value="${emp ? emp.full_name : ''}" class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">แผนก <span class="text-red-500">*</span></label>
                                <input type="text" name="department" required placeholder="เช่น IT, HR, Marketing" value="${emp ? emp.department : ''}" class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">ตำแหน่งงาน <span class="text-red-500">*</span></label>
                                <input type="text" name="position" required value="${emp ? emp.position : ''}" class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">เงินเดือน (บาท) <span class="text-red-500">*</span></label>
                                <input type="number" name="salary" required step="0.01" value="${emp ? emp.salary : ''}" class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">เบอร์โทรศัพท์</label>
                                <input type="text" name="phone" value="${emp ? emp.phone || '' : ''}" class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition">
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700">รูปภาพโปรไฟล์พนักงาน (จะผ่านการบีบอัดอัตโนมัติ)</label>
                            <input type="file" id="emp_avatar" accept="image/*" class="mt-1 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-medium file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 transition">
                            ${emp && emp.avatar_url ? `<p class="text-xs text-gray-500 mt-1">มีรูปภาพเดิมอยู่แล้ว หากไม่เลือกใหม่จะใช้รูปเดิม</p>` : ''}
                        </div>

                        <div class="pt-4 flex items-center justify-end space-x-3 border-t border-gray-100">
                            <button type="button" onclick="navigateTo('employee_list')" class="px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-100 rounded-lg transition-colors">ยกเลิก</button>
                            <button type="submit" class="px-4 py-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-lg shadow transition-colors">บันทึกข้อมูล</button>
                        </div>
                    </form>
                </div>
            `;
        }

        function renderUserManagementView() {
            return `
                <div class="space-y-6">
                    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                        <div>
                            <h1 class="text-2xl font-bold text-gray-900">จัดการผู้ใช้งานระบบ (Admin Only)</h1>
                            <p class="text-sm text-gray-500">สร้าง แก้ไขสิทธิ์ หรือลบสิทธิ์การเข้าใช้งานโปรแกรม</p>
                        </div>
                        <button onclick="navigateTo('user_form')" class="inline-flex items-center space-x-2 px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm rounded-lg shadow transition-colors">
                            <i data-lucide="plus-circle" class="w-4 h-4"></i>
                            <span>เพิ่มผู้ใช้ใหม่</span>
                        </button>
                    </div>

                    <div class="bg-white rounded-xl border border-gray-200 overflow-hidden shadow-sm">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead class="bg-gray-50 border-b border-gray-200">
                                    <tr>
                                        <th class="p-4 text-xs font-semibold uppercase text-gray-500">ชื่อผู้ใช้ (Username)</th>
                                        <th class="p-4 text-xs font-semibold uppercase text-gray-500">ชื่อ-นามสกุล</th>
                                        <th class="p-4 text-xs font-semibold uppercase text-gray-500">สิทธิ์ผู้ใช้งาน (Role)</th>
                                        <th class="p-4 text-xs font-semibold uppercase text-gray-500 text-center">จัดการ</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-gray-100">
                                    ${appState.users.map(u => `
                                        <tr class="hover:bg-gray-50/70 transition-colors">
                                            <td class="p-4 text-sm font-semibold text-gray-900">${u.username}</td>
                                            <td class="p-4 text-sm text-gray-700">${u.full_name}</td>
                                            <td class="p-4 text-sm">
                                                <span class="px-2.5 py-1 text-xs font-medium rounded-full ${
                                                    u.role === 'admin' ? 'bg-red-50 text-red-700 border border-red-100' :
                                                    u.role === 'hr' ? 'bg-green-50 text-green-700 border border-green-100' :
                                                    'bg-blue-50 text-blue-700 border border-blue-100'
                                                }">${u.role.toUpperCase()}</span>
                                            </td>
                                            <td class="p-4 text-center space-x-2 whitespace-nowrap">
                                                <button onclick="appState.editingUser = ${JSON.stringify(u).replace(/"/g, '&quot;')}; navigateTo('user_form');" class="p-1.5 text-blue-600 hover:bg-blue-50 rounded transition-colors"><i data-lucide="pencil" class="w-4 h-4"></i></button>
                                                <button onclick="deleteUser(${u.id})" class="p-1.5 text-red-600 hover:bg-red-50 rounded transition-colors" ${appState.user.id === u.id ? 'disabled title="ไม่สามารถลบตัวเองได้" style="opacity:0.4;"' : ''}><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderUserFormView() {
            const u = appState.editingUser;
            return `
                <div class="max-w-md mx-auto space-y-6">
                    <div>
                        <h1 class="text-2xl font-bold text-gray-900">${u ? 'แก้ไขข้อมูลผู้ใช้' : 'เพิ่มผู้ใช้งานระบบใหม่'}</h1>
                        <p class="text-sm text-gray-500">กำหนดบัญชีและสิทธิ์การเข้าใช้งานระบบ</p>
                    </div>

                    <form onsubmit="saveUser(event)" class="bg-white border border-gray-200 rounded-xl p-6 shadow-sm space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">ชื่อผู้ใช้ (Username) <span class="text-red-500">*</span></label>
                            <input type="text" name="username" required value="${u ? u.username : ''}" class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">รหัสผ่าน (Password) <span class="text-red-500">*</span></label>
                            <input type="password" name="password" required value="${u ? u.password : ''}" class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">ชื่อ-นามสกุลจริง <span class="text-red-500">*</span></label>
                            <input type="text" name="full_name" required value="${u ? u.full_name : ''}" class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">สิทธิ์ผู้ใช้งาน (Role) <span class="text-red-500">*</span></label>
                            <select name="role" required class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg bg-white outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition">
                                <option value="employee" ${u && u.role === 'employee' ? 'selected' : ''}>Employee (ดูข้อมูลตนเอง)</option>
                                <option value="hr" ${u && u.role === 'hr' ? 'selected' : ''}>HR (จัดการพนักงาน)</option>
                                <option value="admin" ${u && u.role === 'admin' ? 'selected' : ''}>Admin (จัดการระบบทั้งหมด)</option>
                            </select>
                        </div>

                        <div class="pt-4 flex items-center justify-end space-x-3 border-t border-gray-100">
                            <button type="button" onclick="navigateTo('user_management')" class="px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-100 rounded-lg transition-colors">ยกเลิก</button>
                            <button type="submit" class="px-4 py-2 text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg shadow transition-colors">บันทึกข้อมูล</button>
                        </div>
                    </form>
                </div>
            `;
        }
    </script>
</body>
</html>
